name: Sulekha
description: 'Sulekha is an online local-services marketplace and classifieds platform
  serving Indian communities in the United States and Canada (us.sulekha.com) as well
  as its origin market in India (sulekha.com). It connects consumers with local service
  providers across housing and rentals, events and concert tickets, jobs, care services
  (nannies, eldercare, housekeeping), real estate, beauty, photography, immigration,
  astrology, travel and IT training. Sulekha operates as a consumer-facing web and
  mobile marketplace rather than an API producer; no public developer portal, API
  reference, or programmatic integration surface is published. It is tracked in the
  API Evangelist network as a portfolio company of Norwest Venture Partners.'
